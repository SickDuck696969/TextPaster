# TextPaster 1.1.1 - printable ASCII, US keyboard
# Settings must appear before the text sections.
version=2
combo=L+ZR
delay_ms=40
# ID of the entry to paste. Use 0 only if there are no entries.
selected=1

# Up to 32 entries, each with a unique positive numeric ID.
# Names: 1-48 characters. Text: 1-512 characters, one line.
# Everything after text= is literal, including spaces and equals signs.
[text:1]
name=Greeting
text=Hello from TextPaster

[text:2]
name=Email
text=yourname@example.com
